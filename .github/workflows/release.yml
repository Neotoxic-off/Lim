# Checks every push to dev and master and every pull request. A pushed `vX.Y.Z` tag, on the commit that sets that
# version in Cargo.toml, also becomes a release with a binary per platform, which `<Leader>pu` (`:upgrade`)
# downloads. A change to the docs alone is not checked.
name: Release

on:
  push:
    branches: [master, dev]
    tags: ["v*"]
    paths-ignore: ["docs/**", "**.md", LICENSE]
  pull_request:
    paths-ignore: ["docs/**", "**.md", LICENSE]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal --component clippy,rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      # The perf budgets are set for a dev machine; shared runners are slower and noisy, so they run locally only.
      - run: "cargo test -- --skip perf::"

  # The binaries report Cargo.toml's version, so it must be the tag's, or `<Leader>pu` would offer the release forever.
  version:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME but Cargo.toml says $version"
            exit 1
          fi

  # Asset names are lim-{ARCH}-{OS}{EXE_SUFFIX} from std::env::consts, as src/update.rs looks them up.
  build:
    needs: [check, version]
    strategy:
      matrix:
        include:
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, asset: lim-x86_64-linux }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, asset: lim-aarch64-linux }
          - { os: macos-latest, target: aarch64-apple-darwin, asset: lim-aarch64-macos }
          - { os: macos-latest, target: x86_64-apple-darwin, asset: lim-x86_64-macos }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, asset: lim-x86_64-windows.exe }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal --target ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Name the binary
        shell: bash
        run: |
          for bin in lim lim-gui; do
            exe=target/${{ matrix.target }}/release/$bin
            [ -f "$exe.exe" ] && exe="$exe.exe"
            asset="${{ matrix.asset }}"
            cp "$exe" "$bin${asset#lim}"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            ${{ matrix.asset }}
            lim-gui-*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist  # not assets/: the repo has an assets/ folder
          merge-multiple: true
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "lim $GITHUB_REF_NAME" --generate-notes
          fi
