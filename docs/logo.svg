    <ellipse cx="50" cy="72" rx="18" ry="12" transform="rotate(-25 50 72)"/>
    <ellipse cx="150" cy="72" rx="18" ry="12" transform="rotate(25 150 72)"/>
  </g>
  <g fill="#1e222a">
    <circle cx="110" cy="50" r="3.5"/>
    <circle cx="44" cy="66" r="3.5"/>
    <circle cx="156" cy="66" r="3.5"/>
  </g>
  <path d="M38 166 q15 -10 31 0 t31 0 t31 0 t31 0" fill="none" stroke="#61afef" stroke-width="6" stroke-linecap="round"/>
  <text class="word" x="236" y="140" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="132" font-weight="700" letter-spacing="-4">lim</text>
