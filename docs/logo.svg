<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 200" width="520" height="200" role="img" aria-label="lim">
  <style>
    .word { fill: #1e222a; }
    @media (prefers-color-scheme: dark) { .word { fill: #e6e9ef; } }
  </style>
  <defs>
