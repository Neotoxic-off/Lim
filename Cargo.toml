[package]
name = "lim"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "Neovim, fully set up, without Lua, plugin managers or dependencies"
license = "MIT"
repository = "https://github.com/Neotoxic-off/Lim"

[dependencies]
data-encoding = "2.9"
getrandom = "0.4"
jiff = "0.2"
percent-encoding = "2.3"
sha2 = "0.10"
arboard ={ version = "3.7", default-features = false, features = ["wayland-data-control"] }
gix = { version = "0.89", default-features = false, features = ["sha1", "status", "revision", "max-performance-safe"] }
open = "5.4"
ureq = { version = "3.4", default-features = false, features = ["rustls", "win-system-proxy"] }
jsonc-parser = { version = "0.34", features = ["preserve_order"] }
pulldown-cmark = { version = "0.13", default-features = false }
syntect = { version = "5.3", default-features = false, features = ["parsing", "regex-fancy"] }
two-face = { version = "0.5", default-features = false, features = ["syntect-fancy"] }
alacritty_terminal = "0.26"
winit = "0.30"
softbuffer = "0.4"
fontdue = "0.9"

# The crates (syntect's regexes, gix) are optimized even in debug builds, so `cargo test` keeps its perf budgets.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_qualifications = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Colors are written 0xRRGGBB; separators would hide the channels.
unreadable_literal = "allow"
# Lookup tables (theme groups, operator keys) keep one arm per entry on purpose.
match_same_arms = "allow"
# x, y, w, h are the clearest names for screen geometry.
many_single_char_names = "allow"
