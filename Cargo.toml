[package]
name = "lim"
version = "0.1.20"
edition = "2024"
rust-version = "1.88"
description = "Neovim, fully set up, without Lua, plugin managers or dependencies"

[dependencies]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_qualifications = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Colors are written 0xRRGGBB; separators would hide the channels.
unreadable_literal = "allow"
# Lookup tables (theme groups, operator keys) keep one arm per entry on purpose.
match_same_arms = "allow"
# x, y, w, h are the clearest names for screen geometry.
many_single_char_names = "allow"
